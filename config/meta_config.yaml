# ============================================================
# 元数据业务配置文件（由 APP/config/meta_config.py 中的 MetaConfig 解析）
# 作用：描述“有哪些表、每张表有哪些字段、有哪些业务指标”，
#       APP/script/meta_init.py 读取本文件后把数据写入 MySQL / Qdrant / ES。
# 字段说明：
#   tables[].name        表名
#   tables[].role        表角色：fact 事实表 / dim 维度表
#   tables[].description 表的中文业务描述
#   tables[].columns[]   该表的字段列表
#     columns[].name        字段名
#     columns[].role        字段角色：primary_key 主键 / foreign_key 外键 /
#                           measure 度量值（可被聚合）/ dimension 维度值（用于分组过滤）
#     columns[].description 字段的中文业务描述（会被向量化）
#     columns[].alias       字段别名列表（每个别名单独生成一个向量点）
#     columns[].sync        是否把该字段的真实取值同步到 Elasticsearch 做精确值检索
#   metrics[].name             指标名
#   metrics[].description      指标描述（计算口径）
#   metrics[].relevant_columns 指标关联的字段，格式为“表名.字段名”
#   metrics[].alias            指标别名列表
# ============================================================

# 表配置列表
tables:
  # ---------- 地区维度表 ----------
  - name: dim_region
    # 角色：维度表
    role: dim
    # 表描述
    description: 地区维度表，用于描述订单发生的地理区域信息。
    # 该表的字段列表
    columns:
      # 地区主键
      - name: region_id
        role: primary_key
        description: 地区唯一标识。
        alias: [地区ID, 区域ID]
        # 主键取值不参与“按值检索”，故不同步到 ES
        sync: false

      # 省份名称
      - name: province
        role: dimension
        description: 订单所属的省份名称。
        alias: [省份, 省, 所在省份]
        # 用户提问里常出现“广东省”这类具体值，需要同步到 ES 做精确匹配
        sync: true

      # 大区名称
      - name: region_name
        role: dimension
        description: 订单所属的大区名称，如华东、华南等。
        alias: [地区, 区域, 大区]
        # 同步取值到 ES
        sync: true

      # 国家名称
      - name: country
        role: dimension
        description: 地区所属国家名称。
        alias: [国家, 国家名称]
        # 同步取值到 ES
        sync: true

  # ---------- 客户维度表 ----------
  - name: dim_customer
    role: dim
    description: 客户维度表，描述下单客户的基本属性。
    columns:
      # 客户主键
      - name: customer_id
        role: primary_key
        description: 客户唯一标识。
        alias: [客户ID, 用户ID]
        sync: false

      # 客户名称（取值基数较高；当前配置为同步到 ES 做取值检索）
      - name: customer_name
        role: dimension
        description: 客户名称。
        alias: [客户名称, 用户名称]
        # 同步取值到 ES
        sync: true

      # 性别
      - name: gender
        role: dimension
        description: 客户性别。
        alias: [性别]
        sync: true

      # 会员等级
      - name: member_level
        role: dimension
        description: 客户会员等级。
        alias: [会员等级, 用户等级]
        sync: true

  # ---------- 商品维度表 ----------
  - name: dim_product
    role: dim
    description: 商品维度表，描述商品的基本属性信息。
    columns:
      # 商品主键
      - name: product_id
        role: primary_key
        description: 商品唯一标识。
        alias: [商品ID, 产品ID]
        sync: false

      # 商品名称
      - name: product_name
        role: dimension
        description: 商品名称。
        alias: [商品名称, 产品名称]
        sync: true

      # 商品品类
      - name: category
        role: dimension
        description: 商品所属品类。
        alias: [商品类别, 品类, 分类]
        sync: true

      # 商品品牌
      - name: brand
        role: dimension
        description: 商品品牌名称。
        alias: [品牌, 品牌名称]
        sync: true

  # ---------- 时间维度表 ----------
  - name: dim_date
    role: dim
    description: 时间维度表，用于多时间粒度分析。
    columns:
      # 日期主键，格式 yyyyMMdd
      - name: date_id
        role: primary_key
        description: 日期唯一标识，格式 yyyyMMdd。
        alias: [日期ID, 日期]
        sync: false

      # 年份
      - name: year
        role: dimension
        description: 年份。
        alias: [年, 年份]
        # 年份取值有限，且一般按数值过滤，故不同步到 ES
        sync: false

      # 季度（“第一季度”这类问法需要按值过滤，故同步）
      - name: quarter
        role: dimension
        description: 季度。
        alias: [季度]
        sync: true

      # 月份
      - name: month
        role: dimension
        description: 月份。
        alias: [月, 月份]
        # 按月过滤一般走数值比较，故不同步到 ES
        sync: false

      # 日
      - name: day
        role: dimension
        description: 日。
        alias: [日, 天]
        # 天粒度取值固定且无需按值检索，故不同步到 ES
        sync: false

  # ---------- 订单事实表 ----------
  - name: fact_order
    # 角色：事实表
    role: fact
    description: 订单事实表，记录订单数量和金额等核心指标。
    columns:
      # 订单主键
      - name: order_id
        role: primary_key
        description: 订单唯一标识。
        alias: [订单ID]
        sync: false

      # 外键：关联客户维度
      - name: customer_id
        role: foreign_key
        description: 关联客户维度的外键。
        alias: [客户ID, 用户ID]
        sync: false

      # 外键：关联商品维度
      - name: product_id
        role: foreign_key
        description: 关联商品维度的外键。
        alias: [商品ID, 产品ID]
        sync: false

      # 外键：关联时间维度
      - name: date_id
        role: foreign_key
        description: 关联时间维度的外键。
        alias: [日期, 下单日期]
        sync: false

      # 外键：关联地区维度
      - name: region_id
        role: foreign_key
        description: 关联地区维度的外键。
        alias: [地区ID, 区域ID]
        sync: false

      # 度量值：购买数量，可被 SUM 聚合
      - name: order_quantity
        role: measure
        description: 订单中商品的购买数量。
        alias: [销量, 购买数量, 件数]
        sync: false

      # 度量值：订单金额，可被 SUM 聚合（GMV 的核心字段）
      - name: order_amount
        role: measure
        description: 订单金额。
        alias: [销售额, 订单金额, 收入]
        sync: false

# 指标配置列表
metrics:
  # 成交总额
  - name: GMV
    description: 全称Gross Merchandise Value，表示所有订单的成交金额总和。
    # 关联字段：订单金额（会写入 t_metric_column 关系表）
    relevant_columns:
      - fact_order.order_amount
    # 指标别名，用户可能用这些词提问
    alias: [成交总额, 订单总额]
  # 平均客单价
  - name: AOV
    description: 全称Average Order Value，表示所有订单的成交金额平均值。
    # 关联字段：订单金额（AOV = 订单金额总和 / 订单数，因此依赖 order_amount）
    relevant_columns:
      - fact_order.order_amount
    # 指标别名
    alias: [平均单价, 平均订单金额]
